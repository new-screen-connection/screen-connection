[package]
name = "screenguard"
version = "0.4.0"
description = "跨平台显示器控制与色彩/多屏助手"
authors = ["陆冠霖"]
license = "MIT"
repository = "https://github.com/Personalscreenguard/screenguard"
readme = "../README.md"
edition = "2021"

[lib]
name = "screenguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
base64 = "0.22"
# 排障助手第三层（可选联网分析，默认关闭）走 HTTPS 需要 TLS 客户端；
# ureq 是同步阻塞的最小实现，不引 tokio 全家桶，且只在用户明确同意后才被调用
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# 单实例：命名互斥量（瞬时、无竞态）。旧的「PID 谁小谁留」+ PowerShell 查询
# 有 1~2s 竞态窗口 —— 快速双击时多个实例同时存活（托盘积压），命中守卫时
# 新实例静默退出又像「闪退」。本插件的回调负责唤出已有主窗口。
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
ddc = "=0.2.2"
ddc-macos = "=0.2.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
